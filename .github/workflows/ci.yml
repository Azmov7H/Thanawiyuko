name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Build must succeed without a live DB (lazy connections only).
          DATABASE_URL: mongodb://localhost:27017/thanawico-ci
          AUTH_SECRET: ci-placeholder-secret

  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          DATABASE_URL: mongodb://localhost:27017/thanawico-ci
          AUTH_SECRET: ci-placeholder-secret
      - run: npm run test:a11y
        env:
          CI: true
          DATABASE_URL: mongodb://localhost:27017/thanawico-ci
          AUTH_SECRET: ci-placeholder-secret
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
